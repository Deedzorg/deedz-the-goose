name: Restore verified Deedz Engine v1.6.1

on:
  push:
    branches: [infrastry-v1.6.1]
    paths: [_import/READY]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deedz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d deedz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deedz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover staged source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deedz-candidates /tmp/deedz-v161-restored
          mkdir -p /tmp/deedz-candidates /tmp/deedz-v161-restored

          python3 <<'PY'
          from pathlib import Path
          import base64

          root = Path('_import')
          groups = {
              'chunks': sorted(root.glob('chunk-*.b64')),
              'parts': sorted(root.glob('part-*.b64')),
              'finals': sorted(root.glob('final-*.b64')),
          }
          orders = {
              'chunks': groups['chunks'],
              'chunks_parts': groups['chunks'] + groups['parts'],
              'chunks_finals': groups['chunks'] + groups['finals'],
              'chunks_parts_finals': groups['chunks'] + groups['parts'] + groups['finals'],
          }
          out = Path('/tmp/deedz-candidates')

          def clean_text(path):
              text = path.read_text(errors='ignore')
              return ''.join(ch for ch in text if ch.isalnum() or ch in '+/=')

          for label, files in orders.items():
              if not files:
                  continue
              pieces = [clean_text(p) for p in files]

              # Method 1: treat the staged files as slices of one base64 stream.
              stream = ''.join(pieces)
              try:
                  data = base64.b64decode(stream, validate=False)
                  (out / f'{label}-continuous.tgz').write_bytes(data)
              except Exception as exc:
                  print(label, 'continuous decode failed:', exc)

              # Method 2: recover a continuous stream even if intermediate upload
              # chunks were independently padded.
              no_pad = ''.join(piece.rstrip('=') for piece in pieces)
              no_pad += '=' * ((4 - len(no_pad) % 4) % 4)
              try:
                  data = base64.b64decode(no_pad, validate=False)
                  (out / f'{label}-repad.tgz').write_bytes(data)
              except Exception as exc:
                  print(label, 'repad decode failed:', exc)

              # Method 3: each staged file may have been encoded independently.
              binary = bytearray()
              ok = True
              for piece in pieces:
                  padded = piece + '=' * ((4 - len(piece) % 4) % 4)
                  try:
                      binary.extend(base64.b64decode(padded, validate=False))
                  except Exception as exc:
                      print(label, 'segment decode failed:', exc)
                      ok = False
                      break
              if ok:
                  (out / f'{label}-segments.tgz').write_bytes(binary)
          PY

          bundle=''
          for candidate in /tmp/deedz-candidates/*.tgz; do
            echo "Checking $candidate ($(stat -c%s "$candidate") bytes)"
            if gzip -t "$candidate" 2>/dev/null && tar -tzf "$candidate" >/dev/null 2>&1; then
              bundle="$candidate"
              break
            fi
          done

          if [ -z "$bundle" ]; then
            echo 'No staged candidate produced a valid gzip/tar source bundle.' >&2
            ls -lh /tmp/deedz-candidates >&2 || true
            exit 1
          fi

          echo "Recovered source bundle: $bundle"
          sha256sum "$bundle"
          tar -xzf "$bundle" -C /tmp/deedz-v161-restored

          root=/tmp/deedz-v161-restored
          if [ ! -f "$root/package.json" ]; then
            package="$(find "$root" -mindepth 2 -maxdepth 3 -name package.json -print -quit)"
            test -n "$package"
            root="$(dirname "$package")"
          fi
          echo "$root" > /tmp/deedz-source-root

          test -f "$root/server/index.js"
          test -f "$root/server/networking/WebSocketServer.js"
          test -f "$root/server/rooms/RoomManager.js"
          test -f "$root/src/engine/DeedzEngine.js"
          test -f "$root/src/games/deedz-the-goose/entities/PlayerGoose.js"
          test -f "$root/src/games/deedz-the-goose/entities/RemoteGoose.js"
          test -f "$root/src/games/deedz-the-goose/ui/TouchControls.js"
          test -f "$root/tests/v1.6.1-hotfix.test.js"
          node -e "const p=require(process.argv[1]); if(p.version!=='1.6.1') process.exit(1); console.log('Deedz Engine', p.version)" "$root/package.json"

      - name: Replace staging tree with restored engine
        run: |
          set -euo pipefail
          root="$(cat /tmp/deedz-source-root)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Validate full engine
        run: npm run validate

      - name: Validate cloud integration when present
        run: npm run test:cloud --if-present

      - name: Commit reconstructed source
        run: |
          git config user.name "Deedz Engine Restore"
          git config user.email "37595805+Deedzorg@users.noreply.github.com"
          git add -A
          git commit -m "Restore full Deedz Engine v1.6.1 for Infrastry"
          git push origin HEAD:infrastry-v1.6.1
