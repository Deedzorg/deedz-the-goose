name: Restore verified Deedz Engine v1.6.1

on:
  push:
    branches: [infrastry-v1.6.1]
    paths: [_import/READY]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deedz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d deedz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deedz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and inspect source bundle
        run: |
          cat _import/final-*.b64 > /tmp/deedz-v161-source.b64
          base64 --decode /tmp/deedz-v161-source.b64 > /tmp/deedz-v161-source.zip
          sha256sum /tmp/deedz-v161-source.zip
          unzip -tq /tmp/deedz-v161-source.zip
          rm -rf /tmp/deedz-v161-restored
          mkdir -p /tmp/deedz-v161-restored
          unzip -q /tmp/deedz-v161-source.zip -d /tmp/deedz-v161-restored
          test -f /tmp/deedz-v161-restored/server/index.js
          test -f /tmp/deedz-v161-restored/server/networking/WebSocketServer.js
          test -f /tmp/deedz-v161-restored/server/rooms/RoomManager.js
          test -f /tmp/deedz-v161-restored/src/engine/DeedzEngine.js
          test -f /tmp/deedz-v161-restored/src/games/deedz-the-goose/entities/PlayerGoose.js
          test -f /tmp/deedz-v161-restored/src/games/deedz-the-goose/entities/RemoteGoose.js
          test -f /tmp/deedz-v161-restored/src/games/deedz-the-goose/ui/TouchControls.js
          test -f /tmp/deedz-v161-restored/tests/v1.6.1-hotfix.test.js
          node -e "const p=require('/tmp/deedz-v161-restored/package.json'); if(p.version!=='1.6.1') process.exit(1); console.log('Deedz Engine', p.version)"

      - name: Replace staging tree with restored engine
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/deedz-v161-restored/. .

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Validate full engine
        run: npm run validate

      - name: Validate cloud integration when present
        run: npm run test:cloud --if-present

      - name: Commit reconstructed source
        run: |
          git config user.name "Deedz Engine Restore"
          git config user.email "37595805+Deedzorg@users.noreply.github.com"
          git add -A
          git commit -m "Restore full Deedz Engine v1.6.1 for Infrastry"
          git push origin HEAD:infrastry-v1.6.1
